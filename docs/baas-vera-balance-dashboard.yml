openapi: 3.2.1

info:
  title: baas-vera-balance-dashboard
  summary: Vera Balance Dashboard API specification
  contact:
    name: Jorge Salgado
    email: jorge.salgado7@outlook.com
  version: 1.0.0

tags:
- name: Clinics
  description: Administración de clínicas
- name: Users
  description: Administración de usuarios
- name: Auth
  description: Autenticación y administración de sesión
- name: Catalogs
  description: Administración de catálogos
- name: Patients
  description: Administración de pacientes
- name: Therapeutic Processes
  description: Administración de procesos terapéuticos
- name: Records
  description: Administración de registros de sesión
- name: Home Works
  description: Administración de tareas

paths:

  /v1/clinics:
    post:
      tags:
      - Clinics
      summary: Crear clínica
      operationId: createClinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClinicRequest'
            example:
              name: Vera Balance
              logo: null
              address: Nicolás Romero, Estado de México
              phone_number: '5564838512'
              therapy_types:
              - name: Terapia individual
                icon: bi bi-person
              - name: Terapia de pareja
                icon: bi bi-people
              - name: Terapia infantil
                icon: bi bi-balloon-heart
              - name: Terapia familiar
                icon: bi bi-house-heart
      responses:
        '201':
          description: Clínica creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'

    get:
      tags:
      - Clinics
      summary: Obtener clínicas
      operationId: getClinics
      responses:
        '200':
          description: Clínicas obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClinicResponse'

  /v1/clinics/{id}:
    parameters:
    - $ref: '#/components/parameters/ClinicId'

    get:
      tags:
      - Clinics
      summary: Obtener clínica
      operationId: getClinicById
      responses:
        '200':
          description: Clínica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'

    put:
      tags:
      - Clinics
      summary: Actualizar clínica
      operationId: updateClinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicRequest'
      responses:
        '200':
          description: Clínica actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'

    delete:
      tags:
      - Clinics
      summary: Eliminar clínica
      operationId: deleteClinic
      responses:
        '204':
          description: Clínica eliminada correctamente

  /v1/clinics/user/{userId}:
    parameters:
    - $ref: '#/components/parameters/ClinicUserId'

    get:
      tags:
      - Clinics
      summary: Obtener clínica de un usuario
      operationId: getClinicByUserId
      responses:
        '200':
          description: Clínica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'

  /v1/users:
    post:
      tags:
      - Users
      summary: Crear usuario
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: Mónica Vera
              email: monica@verabalance.com
              password: Password123
              professional_license: '12345678'
              clinic_id: 7cb3a81a-e137-4ef4-aafd-6e387c8c7390
              role: therapist
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    get:
      tags:
      - Users
      summary: Obtener usuarios
      operationId: getUsers
      responses:
        '200':
          description: Usuarios obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'

  /v1/users/{id}:
    parameters:
    - $ref: '#/components/parameters/UserId'

    get:
      tags:
      - Users
      summary: Obtener usuario
      operationId: getUserById
      responses:
        '200':
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    put:
      tags:
      - Users
      summary: Actualizar usuario
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              name: Mónica Vera
              email: monica@verabalance.com
              professional_license: '12345678'
              role: therapist
              status: active
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    delete:
      tags:
      - Users
      summary: Eliminar usuario
      operationId: deleteUser
      responses:
        '204':
          description: Usuario eliminado correctamente

  /v1/users/{id}/status:
    parameters:
    - $ref: '#/components/parameters/UserId'

    patch:
      tags:
      - Users
      summary: Cambiar estatus del usuario
      operationId: changeUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: inactive
      responses:
        '200':
          description: Estatus actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /v1/auth/sign-in:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: terapeuta@verabalance.com
              password: Password123!
      responses:
        '200':
          description: Sesión iniciada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales incorrectas

  /v1/auth/sign-out:
    post:
      tags:
      - Auth
      summary: Cerrar sesión
      operationId: signOut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
      responses:
        '204':
          description: Sesión cerrada correctamente

  /v1/auth/verify:
    post:
      tags:
      - Auth
      summary: Verificar sesión
      operationId: verifySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTokenRequest'
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /v1/auth/reset-password:
    post:
      tags:
      - Auth
      summary: Cambiar contraseña
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              email: monica@verabalance.com
              password: NewPassword123
      responses:
        '200':
          description: Contraseña actualizada correctamente

  /v1/catalogs:
    post:
      tags:
      - Catalogs
      summary: Crear catálogo
      operationId: createCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogRequest'
      responses:
        '201':
          description: Catálogo creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'

    get:
      tags:
      - Catalogs
      summary: Obtener catálogos
      operationId: getCatalogs
      responses:
        '200':
          description: Catálogos obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogResponse'

  /v1/catalogs/{id}:
    parameters:
    - $ref: '#/components/parameters/CatalogId'

    get:
      tags:
      - Catalogs
      summary: Obtener catálogo
      operationId: getCatalogById
      responses:
        '200':
          description: Catálogo obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'

    patch:
      tags:
      - Catalogs
      summary: Actualizar catálogo
      operationId: updateCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogRequest'
      responses:
        '200':
          description: Catálogo actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'

    delete:
      tags:
      - Catalogs
      summary: Eliminar catálogo
      operationId: deleteCatalog
      responses:
        '204':
          description: Catálogo eliminado correctamente

  /v1/patients:
    post:
      tags:
      - Patients
      summary: Crear paciente
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Paciente creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'

    get:
      tags:
      - Patients
      summary: Obtener pacientes
      operationId: getPatients
      responses:
        '200':
          description: Pacientes obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientResponse'

  /v1/patients/{id}:
    parameters:
    - $ref: '#/components/parameters/PatientId'

    get:
      tags:
      - Patients
      summary: Obtener paciente
      operationId: getPatientById
      responses:
        '200':
          description: Paciente obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'

    put:
      tags:
      - Patients
      summary: Actualizar paciente
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Paciente actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'

    delete:
      tags:
      - Patients
      summary: Eliminar paciente
      operationId: deletePatient
      responses:
        '204':
          description: Paciente eliminado correctamente

  /v1/therapeutic-processes:
    post:
      tags:
      - Therapeutic Processes
      summary: Crear proceso terapéutico
      operationId: createTherapeuticProcess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTherapeuticProcessRequest'
            example:
              therapy_type: Terapia individual
              therapist_id: 8a9bf669-7079-4b85-a2fe-7c4d46d11f20
              patient_ids:
              - 98e4819a-b171-46b9-8782-19bb80eb777c
              is_first_time: true
              consultation_reason: Ansiedad y dificultades para gestionar sus emociones.
              goals: Desarrollar herramientas para la regulación emocional.
      responses:
        '201':
          description: Proceso terapéutico creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapeuticProcessResponse'

    get:
      tags:
      - Therapeutic Processes
      summary: Obtener procesos terapéuticos
      operationId: getTherapeuticProcesses
      responses:
        '200':
          description: Procesos terapéuticos obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TherapeuticProcessResponse'

  /v1/therapeutic-processes/{id}:
    parameters:
    - $ref: '#/components/parameters/TherapeuticProcessId'

    get:
      tags:
      - Therapeutic Processes
      summary: Obtener proceso terapéutico
      operationId: getTherapeuticProcessById
      responses:
        '200':
          description: Proceso terapéutico obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapeuticProcessResponse'

    put:
      tags:
      - Therapeutic Processes
      summary: Actualizar proceso terapéutico
      operationId: updateTherapeuticProcess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTherapeuticProcessRequest'
      responses:
        '200':
          description: Proceso terapéutico actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapeuticProcessResponse'

    delete:
      tags:
      - Therapeutic Processes
      summary: Eliminar proceso terapéutico
      operationId: deleteTherapeuticProcess
      responses:
        '204':
          description: Proceso terapéutico eliminado correctamente

  /v1/therapeutic-processes/{id}/status:
    parameters:
    - $ref: '#/components/parameters/TherapeuticProcessId'

    patch:
      tags:
      - Therapeutic Processes
      summary: Cambiar estatus del proceso terapéutico
      operationId: changeTherapeuticProcessStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTherapeuticProcessStatusRequest'
            example:
              status: inactive
      responses:
        '200':
          description: Estatus actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapeuticProcessResponse'

  /v1/therapeutic-processes/patient/{patientId}:
    parameters:
    - $ref: '#/components/parameters/PatientProcessId'

    get:
      tags:
      - Therapeutic Processes
      summary: Obtener procesos terapéuticos de un paciente
      operationId: getTherapeuticProcessesByPatientId
      responses:
        '200':
          description: Procesos terapéuticos obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TherapeuticProcessResponse'

  /v1/records:
    post:
      tags:
      - Records
      summary: Crear registro de sesión
      operationId: createRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordRequest'
            example:
              therapeutic_process_id: 668bcdda-ec9b-4b3a-872d-5a3e88a83d41
              session_date: '2026-08-12T17:00:00-06:00'
              is_attendance: true
              resume: Durante la sesión se trabajó en la identificación de emociones.
              tools: Técnica de respiración y registro emocional.
              home_work_ids:
              - bc40e184-d62c-4579-b62d-566428514cdc
      responses:
        '201':
          description: Registro de sesión creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'

    get:
      tags:
      - Records
      summary: Obtener registros de sesión
      operationId: getRecords
      responses:
        '200':
          description: Registros de sesión obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordResponse'

  /v1/records/{id}:
    parameters:
    - $ref: '#/components/parameters/RecordId'

    get:
      tags:
      - Records
      summary: Obtener registro de sesión
      operationId: getRecordById
      responses:
        '200':
          description: Registro de sesión obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'

    put:
      tags:
      - Records
      summary: Actualizar registro de sesión
      operationId: updateRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordRequest'
      responses:
        '200':
          description: Registro de sesión actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'

    delete:
      tags:
      - Records
      summary: Eliminar registro de sesión
      operationId: deleteRecord
      responses:
        '204':
          description: Registro de sesión eliminado correctamente

  /v1/records/therapeutic-process/{therapeuticProcessId}:
    parameters:
    - $ref: '#/components/parameters/TherapeuticProcessRecordId'

    get:
      tags:
      - Records
      summary: Obtener registros de un proceso terapéutico
      operationId: getRecordsByTherapeuticProcessId
      responses:
        '200':
          description: Registros del proceso terapéutico obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordResponse'

  /v1/home-works:
    post:
      tags:
      - Home Works
      summary: Crear tarea
      operationId: createHomeWork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHomeWorkRequest'
            example:
              description: Realizar registro diario de emociones.
              is_completed: false
      responses:
        '201':
          description: Tarea creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeWorkResponse'

    get:
      tags:
      - Home Works
      summary: Obtener tareas
      operationId: getHomeWorks
      responses:
        '200':
          description: Tareas obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HomeWorkResponse'

  /v1/home-works/{id}:
    parameters:
    - $ref: '#/components/parameters/HomeWorkId'

    get:
      tags:
      - Home Works
      summary: Obtener tarea
      operationId: getHomeWorkById
      responses:
        '200':
          description: Tarea obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeWorkResponse'

    put:
      tags:
      - Home Works
      summary: Actualizar tarea
      operationId: updateHomeWork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHomeWorkRequest'
      responses:
        '200':
          description: Tarea actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeWorkResponse'

    delete:
      tags:
      - Home Works
      summary: Eliminar tarea
      operationId: deleteHomeWork
      responses:
        '204':
          description: Tarea eliminada correctamente

components:

  parameters:
    ClinicId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ClinicUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CatalogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TherapeuticProcessId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PatientProcessId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TherapeuticProcessRecordId:
      name: therapeuticProcessId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    HomeWorkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    DateTime:
      type: string
      format: date-time

    UserRole:
      type: string
      enum:
      - clinic
      - therapist

    UserStatus:
      type: string
      enum:
      - active
      - inactive

    ClinicStatus:
      type: string
      enum:
      - active
      - inactive

    TherapeuticProcessStatus:
      type: string
      enum:
      - active
      - inactive
      - discharged
      - unfinished

    TherapyType:
      type: object
      required:
      - name
      - icon
      properties:
        name:
          type: string
        icon:
          type: string

    ClinicReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid

    UserReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid

    PatientReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid

    RecordReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid

    HomeWorkReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid

    CreateClinicRequest:
      type: object
      required:
      - name
      - address
      - phone_number
      - therapy_types
      properties:
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'

    UpdateClinicRequest:
      type: object
      properties:
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
        status:
          $ref: '#/components/schemas/ClinicStatus'

    ClinicResponse:
      type: object
      required:
      - id
      - name
      - logo
      - address
      - phone_number
      - therapy_types
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
        status:
          $ref: '#/components/schemas/ClinicStatus'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'

    CreateUserRequest:
      type: object
      required:
      - name
      - email
      - password
      - professional_license
      - clinic_id
      - role
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        professional_license:
          type: string
        clinic_id:
          type:
          - string
          - 'null'
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        professional_license:
          type: string
        clinic_id:
          type:
          - string
          - 'null'
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'

    UpdateUserStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'

    UserResponse:
      type: object
      required:
      - id
      - name
