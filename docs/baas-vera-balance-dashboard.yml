components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.1
            title: Bad request.
            status: 400
            instance: /resources
            detail: Validate the request fields.
            errors:
            - field: email
              message: Email format is invalid.
    Unauthorized:
      description: Autenticación inválida o requerida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7235#section-3.1
            title: Unauthorized.
            status: 401
            instance: /resources
            detail: Authentication is required.
            errors: []
    Forbidden:
      description: Acceso denegado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.3
            title: Forbidden.
            status: 403
            instance: /resources
            detail: You do not have permission to access this resource.
            errors: []
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.4
            title: Not found.
            status: 404
            instance: /resources
            detail: The requested resource was not found.
            errors: []
    Conflict:
      description: Conflicto con el recurso
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.5.8
            title: Conflict.
            status: 409
            instance: /resources
            detail: The resource conflicts with an existing record.
            errors: []
    TooManyRequests:
      description: Demasiadas solicitudes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://www.rfc-editor.org/rfc/rfc6585#section-4
            title: Too many requests.
            status: 429
            instance: /resources
            detail: Too many requests. Please try again later.
            errors: []
    InternalServerError:
      description: Error interno del servidor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc7231#section-6.6.1
            title: Internal server error.
            status: 500
            instance: /resources
            detail: An unexpected error occurred.
            errors: []
  schemas:
    UUID:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
    Status:
      type: string
      enum:
      - Activo
      - Inactivo
    Gender:
      type: string
      enum:
      - Masculino
      - Femenino
    MaritalStatus:
      type: string
      enum:
      - Soltero
      - Casado
      - En una relación
      - Viudo
    EducationalLevel:
      type: string
      enum:
      - Kinder
      - Primaria
      - Secundaria
      - Preparatoria
      - Universidad
      - Maestría
      - Sin estudios
    TherapeuticProcessStatus:
      type: string
      enum:
      - Activo
      - Dado de alta
      - Proceso interrupido
      - Cancelado
    RecordStatus:
      type: string
      enum:
      - Asistida
      - Cancelada
      - Con retraso
      - Falta
    UserRole:
      type: string
      enum:
      - admin
      - clinic
      - therapist
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - instance
      - detail
      - errors
      properties:
        type:
