openapi: 3.2.1
info:
  title: baas-vera-balance-dashboard
  summary: Vera Balance Dashboard API specification
  contact:
    name: Jorge Salgado
    email: jorge.salgado7@outlook.com
  version: 1.1.0
  description: Autenticación por cookie HttpOnly con JWT de cinco minutos. Todas las operaciones están protegidas
    por sessionCookie salvo las excepciones públicas indicadas explícitamente. Las operaciones requieren además
    autorización por rol, clínica y propiedad del recurso. POST /v1/users no es público; el primer usuario
    se crea mediante un procedimiento de bootstrap restringido, no especificado como endpoint público en esta
    API. Las mutaciones basadas en cookies deben protegerse contra CSRF mediante controles adecuados al despliegue.
tags:
- name: Clinics
  description: Administración de clínicas
- name: Users
  description: Administración de usuarios
- name: Auth
  description: Autenticación y administración de sesión
- name: Catalogs
  description: Administración de catálogos
- name: Patients
  description: Administración de pacientes
- name: Therapeutic Processes
  description: Administración de procesos terapéuticos
- name: Records
  description: Administración de registros de sesión
- name: Home Works
  description: Administración de tareas
paths:
  /v1/clinics:
    post:
      tags:
      - Clinics
      summary: Crear clínica
      operationId: createClinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClinicRequest'
            example:
              name: Vera Balance
              logo: null
              address: Nicolás Romero, Estado de México
              phone_number: '5564838512'
              therapy_types:
              - name: Terapia individual
                icon: bi bi-person
              - name: Terapia de pareja
                icon: bi bi-people
              - name: Terapia infantil
                icon: bi bi-balloon-heart
              - name: Terapia familiar
                icon: bi bi-house-heart
      responses:
        '201':
          description: Clínica creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Operación protegida de aprovisionamiento de clínicas. Requiere una capacidad administrativa
        global que todavía no está definida para los roles clinic y therapist. No se utiliza para el bootstrap
        del primer usuario.
    get:
      tags:
      - Clinics
      summary: Obtener clínicas
      operationId: getClinics
      responses:
        '200':
          description: Clínicas obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClinicResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Requiere autorización administrativa global; los usuarios de clínica no pueden enumerar
        clínicas ajenas.
  /v1/clinics/{id}:
    parameters:
    - $ref: '#/components/parameters/ClinicId'
    get:
      tags:
      - Clinics
      summary: Obtener clínica
      operationId: getClinicById
      responses:
        '200':
          description: Clínica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Solo permite acceder a la clínica de la sesión, salvo capacidad administrativa global expresamente
        autorizada.
    put:
      tags:
      - Clinics
      summary: Actualizar clínica
      operationId: updateClinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicRequest'
      responses:
        '200':
          description: Clínica actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: El rol clinic puede actualizar únicamente su propia clínica; no puede modificar clínicas
        ajenas.
    delete:
      tags:
      - Clinics
      summary: Eliminar clínica
      operationId: deleteClinic
      responses:
        '204':
          description: Clínica eliminada correctamente
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Operación de administración global restringida. No disponible para los roles clinic ni therapist
        sin una capacidad administrativa global definida.
  /v1/clinics/user/{userId}:
    parameters:
    - $ref: '#/components/parameters/ClinicUserId'
    get:
      tags:
      - Clinics
      summary: Obtener clínica de un usuario
      operationId: getClinicByUserId
      responses:
        '200':
          description: Clínica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Solo permite consultar la clínica de usuarios de la misma clínica del solicitante; el rol
        therapist solo puede consultar la propia.
  /v1/users:
    post:
      tags:
      - Users
      summary: Crear usuario
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: Mónica Vera
              email: monica@verabalance.com
              password: Password123
              password_confirmation: Password123
              professional_license: '12345678'
              clinic_id: 7cb3a81a-e137-4ef4-aafd-6e387c8c7390
              role: therapist
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida para el rol o la clínica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '429':
          description: Demasiadas solicitudes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
      security:
      - sessionCookie: []
      description: Requiere sesión autenticada y rol clinic. Solo puede crear usuarios en la misma clínica
        del administrador autenticado. El clinic_id solicitado debe coincidir con la clínica de la sesión;
        nunca se acepta una asignación a otra clínica. La contraseña y su confirmación deben coincidir; la
        confirmación no se almacena y la contraseña se persiste únicamente mediante hash seguro. El email debe
        ser único globalmente. El primer usuario se aprovisiona mediante un procedimiento de inicialización
        restringido, fuera de este endpoint.
    get:
      tags:
      - Users
      summary: Obtener usuarios
      operationId: getUsers
      responses:
        '200':
          description: Usuarios obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Requiere rol clinic. Devuelve únicamente los usuarios de la clínica del usuario autenticado;
        nunca permite consultar usuarios de otras clínicas.
  /v1/users/{id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Users
      summary: Obtener usuario
      operationId: getUserById
      responses:
        '200':
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Solo puede consultar usuarios de su propia clínica. El rol therapist puede consultar su
        propio perfil, pero no otros usuarios.
    put:
      tags:
      - Users
      summary: Actualizar usuario
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              name: Mónica Vera
              email: monica@verabalance.com
              professional_license: '12345678'
              role: therapist
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: El rol clinic puede actualizar usuarios de su propia clínica. El rol therapist solo puede
        modificar los datos permitidos de su propio perfil, nunca el rol, la clínica ni el estatus. No se permite
        transferir usuarios entre clínicas. El cambio de contraseña utiliza /v1/auth/reset-password.
    delete:
      tags:
      - Users
      summary: Eliminar usuario
      operationId: deleteUser
      responses:
        '204':
          description: Usuario eliminado correctamente
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Solo rol clinic, sobre usuarios de su propia clínica. Rechaza la eliminación si afecta dependencias
        o invariantes de integridad. No permite eliminar usuarios de otra clínica ni el propio usuario administrador
        sin un procedimiento controlado.
  /v1/users/{id}/status:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - Users
      summary: Cambiar estatus del usuario
      operationId: changeUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: inactive
      responses:
        '200':
          description: Estatus actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
      description: Solo rol clinic. Puede activar o desactivar usuarios de su misma clínica. Impide cambios
        de usuarios de otra clínica y protege la última cuenta administradora activa de la clínica.
  /v1/auth/sign-in:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      description: Valida credenciales y emite un único JWT de sesión con vigencia de 5 minutos mediante cookie
        HttpOnly. No requiere token previo ni devuelve el JWT en el cuerpo. La sesión puede renovarse antes
        de su expiración mientras el frontend detecte actividad.
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: terapeuta@verabalance.com
              password: Password123!
      responses:
        '200':
          description: Sesión iniciada correctamente
          headers:
            Set-Cookie:
              description: Cookie HttpOnly con JWT firmado, expiración de 300 segundos y atributos Secure,
                SameSite=Lax y Path=/.
              schema:
                type: string
              example: vera_balance_session=<jwt>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '429':
          description: Demasiados intentos de inicio de sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
      security: []
  /v1/auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Solicitar recuperación de contraseña
      description: Recibe el email y, si corresponde a una cuenta elegible, genera un código numérico criptográficamente
        aleatorio de 6 dígitos, válido durante 5 minutos y con un máximo de 5 intentos fallidos. Persiste solo
        el hash seguro del código y metadatos de expiración/intentos en DynamoDB (no un JWT). Reemplaza cualquier
        código anterior del usuario. Envía el código mediante Resend utilizando una plantilla de correo propia
        del backend. La respuesta no revela si el email existe. Se aplica limitación de frecuencia para evitar
        abuso.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: monica@verabalance.com
      responses:
        '202':
          description: Solicitud de recuperación aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '429':
          description: Demasiadas solicitudes de recuperación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
  /v1/auth/forgot-password/reset:
    post:
      tags:
      - Auth
      summary: Restablecer contraseña olvidada
      description: Valida email y código de recuperación de seis dígitos contra su hash persistido, vigencia
        de 5 minutos y máximo de 5 intentos. Actualiza la contraseña si el código es correcto y consume/elimina
        atómicamente el registro para impedir reutilización. No inicia sesión. No requiere JWT de sesión. Los
        errores no deben revelar detalles sensibles.
      operationId: resetForgottenPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetForgottenPasswordRequest'
            example:
              email: monica@verabalance.com
              verification_code: '123456'
              password: NewPassword123!
              password_confirmation: NewPassword123!
      responses:
        '200':
          description: Contraseña actualizada correctamente
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Código de verificación inválido, expirado, consumido o con intentos agotados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '429':
          description: Demasiados intentos de verificación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
  /v1/auth/sign-out:
    post:
      tags:
      - Auth
      summary: Cerrar sesión
      description: 'Elimina la cookie de sesión del navegador, incluso si ya expiró. No se almacena ni se revoca
        el JWT en DynamoDB: una copia del JWT previamente emitido sigue siendo criptográficamente válida hasta
        su expiración (máximo 5 minutos). El frontend detiene la renovación y borra su estado de autenticación.'
      operationId: signOut
      security: []
      responses:
        '204':
          description: Sesión cerrada correctamente
          headers:
            Set-Cookie:
              description: Elimina la cookie de sesión estableciendo su expiración.
              schema:
                type: string
              example: vera_balance_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/auth/verify:
    post:
      tags:
      - Auth
      summary: Verificar sesión
      description: Valida firma y expiración del JWT de sesión enviado automáticamente mediante cookie HttpOnly.
        No renueva ni devuelve el JWT. El frontend consulta el estado de la sesión periódicamente (cada 5 minutos
        como comprobación general), pero debe controlar localmente la inactividad y cerrar sesión al cumplir
        5 minutos sin interacción; la comprobación periódica no reemplaza el temporizador de inactividad. Para
        mantener una sesión activa, el frontend debe llamar a /v1/auth/refresh antes del vencimiento, por ejemplo
        con margen de seguridad, y nunca intentar renovar un JWT ya expirado.
      operationId: verifySession
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Sesión inválida o expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Renovar sesión activa
      operationId: refreshSession
      description: Renueva un JWT de sesión válido antes de su expiración, mediante la cookie HttpOnly existente.
        No acepta JWT expirados ni recibe tokens en el body. El frontend solo debe solicitarlo cuando detecte
        actividad reciente del usuario y antes de que transcurran 5 minutos de inactividad; el servidor verifica
        la firma y vigencia del JWT, pero sin estado persistido no puede demostrar por sí mismo la actividad
        real en la interfaz. El nuevo JWT tiene 5 minutos de vigencia. No se persisten JWT ni tokens de refresh.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Sesión renovada correctamente
          headers:
            Set-Cookie:
              description: Reemplaza la cookie de sesión con un nuevo JWT de 5 minutos.
              schema:
                type: string
              example: vera_balance_session=<jwt>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Sesión ausente, inválida o expirada; se requiere iniciar sesión nuevamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
