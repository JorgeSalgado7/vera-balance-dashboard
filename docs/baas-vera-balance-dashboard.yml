      - detail
      properties:
        type:
          type: string
          format: uri
          description: Identifica el tipo de problema que ocurrió. Debe ser una URI que describa el detalle
            del problema.
          example: https://tools.ietf.org/html/rfc7231#section-6.5.1
        title:
          type: string
          description: Breve descripción legible por humanos.
          example: Bad request.
        status:
          type: integer
          format: int32
          description: Código HTTP de respuesta asociado al error.
          example: 400
        instance:
          type: string
          description: URI del recurso relacionado con el error.
          example: /v1/resources
        detail:
          type: string
          description: Explicación específica y legible por humanos sobre el error ocurrido.
          example: Validate that the elements in the request exist and are correct.
