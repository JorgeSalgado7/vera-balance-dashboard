  summary: Vera Balance Dashboard API specification
  contact:
    name: Jorge Salgado
    email: jorge.salgado7@outlook.com
  version: 1.0.0
tags:
- name: Clinics
  description: Administración de clínicas
- name: Users
  description: Administración de usuarios
- name: Auth
  description: Autenticación y administración de sesión
- name: Catalogs
  description: Administración de catálogos
- name: Patients
  description: Administración de pacientes
- name: Therapeutic Processes
  description: Administración de procesos terapéuticos
- name: Records
