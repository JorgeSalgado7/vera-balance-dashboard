      - occupation
      - marital_status
      - partner_data
      - religion
      - address
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        age:
          type: integer
          minimum: 0
        guardian:
          oneOf:
          - $ref: '#/components/schemas/PatientGuardian'
