openapi: 3.2.1
info:
  title: baas-vera-balance-dashboard
  summary: Vera Balance Dashboard API specification
  contact:
    name: Jorge Salgado
    email: jorge.salgado7@outlook.com
  version: 1.0.0
tags:
- name: Clinics
  description: Administración de clínicas
- name: Users
  description: Administración de usuarios
- name: Auth
  description: Autenticación y administración de sesión
- name: Catalogs
  description: Administración de catálogos
- name: Patients
  description: Administración de pacientes
- name: Therapeutic Processes
  description: Administración de procesos terapéuticos
- name: Records
  description: Administración de registros de sesión
- name: Home Works
  description: Administración de tareas
paths:
  /v1/clinics:
    post:
      tags:
      - Clinics
      summary: Crear clínica
      operationId: createClinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClinicRequest'
            example:
              name: Vera Balance
              logo: null
              address: Nicolás Romero, Estado de México
              phone_number: '5564838512'
              therapy_types:
              - name: Terapia individual
                icon: bi bi-person
              - name: Terapia de pareja
                icon: bi bi-people
              - name: Terapia infantil
                icon: bi bi-balloon-heart
              - name: Terapia familiar
                icon: bi bi-house-heart
      responses:
        '201':
          description: Clínica creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
    get:
      tags:
      - Clinics
      summary: Obtener clínicas
      operationId: getClinics
      responses:
        '200':
          description: Clínicas obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClinicResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v1/clinics/{id}:
    parameters:
    - $ref: '#/components/parameters/ClinicId'
    get:
      tags:
      - Clinics
      summary: Obtener clínica
      operationId: getClinicById
      responses:
        '200':
          description: Clínica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
    put:
      tags:
      - Clinics
      summary: Actualizar clínica
      operationId: updateClinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicRequest'
      responses:
        '200':
          description: Clínica actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
    delete:
      tags:
      - Clinics
      summary: Eliminar clínica
      operationId: deleteClinic
      responses:
        '204':
          description: Clínica eliminada correctamente
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v1/clinics/user/{userId}:
    parameters:
    - $ref: '#/components/parameters/ClinicUserId'
    get:
      tags:
      - Clinics
      summary: Obtener clínica de un usuario
      operationId: getClinicByUserId
      responses:
        '200':
          description: Clínica obtenida correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v1/users:
    post:
      tags:
      - Users
      summary: Crear usuario
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: Mónica Vera
              email: monica@verabalance.com
              password: Password123
              password_confirmation: Password123
              professional_license: '12345678'
              clinic_id: 7cb3a81a-e137-4ef4-aafd-6e387c8c7390
              role: therapist
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Public Operation Token ausente, inválido, expirado, consumido o con scope incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
      security:
      - publicOperationToken: []
    get:
      tags:
      - Users
      summary: Obtener usuarios
      operationId: getUsers
      responses:
        '200':
          description: Usuarios obtenidos correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v1/users/{id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Users
      summary: Obtener usuario
      operationId: getUserById
      responses:
        '200':
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
    put:
      tags:
      - Users
      summary: Actualizar usuario
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              name: Mónica Vera
              email: monica@verabalance.com
              professional_license: '12345678'
              role: therapist
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
    delete:
      tags:
      - Users
      summary: Eliminar usuario
      operationId: deleteUser
      responses:
        '204':
          description: Usuario eliminado correctamente
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v1/users/{id}/status:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - Users
      summary: Cambiar estatus del usuario
      operationId: changeUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: inactive
      responses:
        '200':
          description: Estatus actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '409':
          description: Conflicto con el estado actual del recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v1/auth/public-token:
    post:
      tags:
      - Auth
      summary: Crear token para operación pública
      description: Genera un token temporal de un solo uso para una operación que no requiere sesión autenticada. El token queda limitado al scope
        solicitado, tiene vigencia limitada y no puede utilizarse como token de sesión. Una vez aceptado por el endpoint correspondiente, queda
        consumido y no puede reutilizarse.
      operationId: createPublicOperationToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicOperationTokenRequest'
            example:
              scope: auth:sign-in
      responses:
        '201':
          description: Token temporal creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOperationTokenResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/auth/sign-in:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      description: 'Valida las credenciales del usuario y crea una sesión autenticada.


        Requiere un Public Operation Token válido con scope `auth:sign-in`. El token temporal es de un solo uso y se consume al aceptarse la solicitud.


        El JWT de sesión se envía exclusivamente mediante una cookie HttpOnly y no forma parte del cuerpo de la respuesta.'
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: terapeuta@verabalance.com
              password: Password123!
      responses:
        '200':
          description: Sesión iniciada correctamente
          headers:
            Set-Cookie:
              description: Cookie HttpOnly que contiene el JWT de sesión.
              schema:
                type: string
              example: vera_balance_session=<jwt>; Path=/; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      security:
      - publicOperationToken: []
  /v1/auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Solicitar recuperación de contraseña
      description: Solicita el inicio del proceso de recuperación de contraseña. Requiere un Public Operation Token válido con scope `auth:forgot-password`.
        El token temporal es de un solo uso y se consume al aceptarse la solicitud. La respuesta no revela si el email corresponde a un usuario
        existente. Si el usuario existe, el backend genera un Password Recovery Token de vigencia limitada y un solo uso, y lo envía al correo
        asociado. El Password Recovery Token no se devuelve mediante el API y la contraseña no se modifica durante esta operación.
      operationId: forgotPassword
      security:
      - publicOperationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: monica@verabalance.com
      responses:
        '202':
          description: Solicitud de recuperación aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Public Operation Token ausente, inválido, expirado, consumido o con scope incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/auth/forgot-password/reset:
    post:
      tags:
      - Auth
      summary: Restablecer contraseña olvidada
      description: Establece una nueva contraseña utilizando el Password Recovery Token recibido mediante el correo de recuperación. No requiere
        una sesión autenticada ni un Public Operation Token. El Password Recovery Token debe ser válido, vigente, estar asociado a un usuario
        y no haber sido consumido. La identidad del usuario se obtiene a partir del token validado. Después de actualizar correctamente la contraseña,
        el Password Recovery Token queda consumido y no puede reutilizarse. La operación no crea automáticamente una sesión autenticada.
      operationId: resetForgottenPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetForgottenPasswordRequest'
            example:
              recovery_token: password-recovery-token
              password: NewPassword123
              password_confirmation: NewPassword123
      responses:
        '200':
          description: Contraseña actualizada correctamente
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Password Recovery Token ausente, inválido, expirado o consumido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/auth/sign-out:
    post:
      tags:
      - Auth
      summary: Cerrar sesión
      description: 'Cierra la sesión eliminando la cookie HttpOnly utilizada para

        autenticación. El cliente no necesita enviar el JWT en el body.

        '
      operationId: signOut
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Sesión cerrada correctamente
          headers:
            Set-Cookie:
              description: Elimina la cookie de sesión estableciendo su expiración.
              schema:
                type: string
              example: vera_balance_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/auth/verify:
    post:
      tags:
      - Auth
      summary: Verificar sesión
      description: 'Verifica el JWT recibido automáticamente mediante la cookie HttpOnly

        de sesión. El JWT no se recibe ni se devuelve en el body.

        '
      operationId: verifySession
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Sesión inválida o expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /v1/auth/reset-password:
    post:
      tags:
      - Auth
      summary: Cambiar contraseña
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              password: NewPassword123
              password_confirmation: NewPassword123
      responses:
        '200':
          description: Contraseña actualizada correctamente
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '401':
          description: Sesión inválida o no autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Operación no permitida
          content:
            application/json:
