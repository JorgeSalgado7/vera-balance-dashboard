openapi: 3.1.0
info:
  title: baas-vera-balance-dashboard
  version: 1.0.0
  description: "API REST para la gestión de Vera Balance.\n\nRoles:\n- admin: acceso global organizado por clínicas.\n\
    - clinic: acceso completo a su clínica.\n- therapist: acceso a sus pacientes, procesos,\n  registros y tareas\
    \ relacionados.\n\nPersistencia: DynamoDB Single Table Design.\nLas consultas no deben utilizar Scan.\n"
servers:
- url: /
tags:
- name: Auth
- name: Users
- name: Clinics
- name: Patients
- name: Therapy Types
- name: Therapeutic Processes
- name: Records
- name: HomeWorks
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Cerrar sesión
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshSession
      summary: Renovar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Sesión renovada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      operationId: forgotPassword
      summary: Solicitar código de recuperación
      description: 'Genera un código de recuperación y lo envía

        al correo electrónico mediante Resend.

        No revela si el correo existe.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Solicitud procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/forgot-password/reset:
    post:
      tags:
      - Auth
      operationId: resetPassword
      summary: Restablecer contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña restablecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    post:
      tags:
      - Users
      operationId: createUser
      summary: Crear usuario
      description: 'admin puede crear usuarios en cualquier clínica.

        clinic puede crear usuarios de su clínica.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Users
      operationId: getUsers
      summary: Obtener usuarios
      description: Acceso exclusivo de admin.
      responses:
        '200':
          description: Usuarios encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      description: ID del usuario
      schema: &id001
        type: string
    get:
      tags:
      - Users
      operationId: getUser
      summary: Obtener usuario por ID
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Users
      operationId: updateUser
      summary: Actualizar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Users
      operationId: deleteUser
      summary: Eliminar usuario
      responses:
        '204':
          description: Usuario eliminado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}/patients:
    get:
      tags:
      - Users
      operationId: getTherapistPatients
      summary: Obtener pacientes del terapeuta
      description: 'Consulta los procesos del terapeuta mediante

        GSI2 y obtiene sus pacientes relacionados,

        sin duplicados ni Scan.

        '
      parameters:
      - name: userId
        in: path
        required: true
        description: ID del usuario
        schema: *id001
      responses:
        '200':
          description: Pacientes encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}/status:
    patch:
      tags:
      - Users
      operationId: updateUserStatus
      summary: Actualizar estatus del usuario
      parameters:
      - name: userId
        in: path
        required: true
        description: ID del usuario
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatus'
      responses:
        '200':
          description: Estatus actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}/password:
    patch:
      tags:
      - Users
      operationId: changeUserPassword
      summary: Cambiar contraseña
      parameters:
      - name: userId
        in: path
        required: true
        description: ID del usuario
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /clinics:
    post:
      tags:
      - Clinics
      operationId: createClinic
      summary: Crear clínica
      description: Acceso exclusivo de admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClinic'
      responses:
        '201':
          description: Clínica creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Clinics
      operationId: getClinics
      summary: Obtener clínicas
      description: Acceso exclusivo de admin.
      responses:
        '200':
          description: Clínicas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clinic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /clinics/{clinicId}:
    parameters:
    - name: clinicId
      in: path
      required: true
      description: ID de la clínica
      schema: &id002
        type: string
    get:
      tags:
      - Clinics
      operationId: getClinic
      summary: Obtener clínica por ID
      responses:
        '200':
          description: Clínica encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Clinics
      operationId: updateClinic
      summary: Actualizar clínica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinic'
      responses:
        '200':
          description: Clínica actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /clinics/{clinicId}/users:
    get:
      tags:
      - Clinics
      operationId: getClinicUsers
      summary: Obtener usuarios de una clínica
      parameters:
      - name: clinicId
        in: path
        required: true
        description: ID de la clínica
        schema: *id002
      responses:
        '200':
          description: Usuarios encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /clinics/{clinicId}/users/{userId}:
    get:
      tags:
      - Clinics
      operationId: getClinicUser
      summary: Obtener usuario de una clínica
      parameters:
      - name: clinicId
        in: path
        required: true
        description: ID de la clínica
        schema: *id002
      - name: userId
        in: path
        required: true
        description: ID del usuario
        schema: *id001
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /patients:
    post:
      tags:
      - Patients
      operationId: createPatient
      summary: Crear paciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatient'
      responses:
        '201':
          description: Paciente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /patients/clinics/{clinicId}:
    get:
      tags:
      - Patients
      operationId: getClinicPatients
      summary: Obtener pacientes de una clínica
      description: 'admin y clinic pueden consultar los pacientes

        de una clínica autorizada.

        therapist solo puede acceder a sus pacientes

        relacionados.

        '
      parameters:
      - name: clinicId
        in: path
        required: true
        description: ID de la clínica
        schema: *id002
      responses:
        '200':
          description: Pacientes encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /patients/{patientId}:
    parameters:
    - name: patientId
      in: path
      required: true
      description: ID del paciente
      schema: &id003
        type: string
    get:
      tags:
      - Patients
      operationId: getPatient
      summary: Obtener paciente por ID
      responses:
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Patients
      operationId: updatePatient
      summary: Actualizar paciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatient'
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /therapy-types:
    post:
      tags:
      - Therapy Types
      operationId: createTherapyType
      summary: Crear tipo de terapia
      description: Acceso exclusivo de admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTherapyType'
      responses:
        '201':
          description: Tipo de terapia creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapyType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Therapy Types
      operationId: getTherapyTypes
      summary: Obtener tipos de terapia
      responses:
        '200':
          description: Tipos de terapia encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TherapyType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /therapy-types/{therapyTypeId}:
    parameters:
    - name: therapyTypeId
      in: path
      required: true
      description: ID del tipo de terapia
      schema:
        type: string
    get:
      tags:
      - Therapy Types
      operationId: getTherapyType
      summary: Obtener tipo de terapia por ID
      responses:
        '200':
          description: Tipo de terapia encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapyType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Therapy Types
      operationId: updateTherapyType
      summary: Actualizar tipo de terapia
      description: Acceso exclusivo de admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTherapyType'
      responses:
        '200':
          description: Tipo de terapia actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapyType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Therapy Types
      operationId: deleteTherapyType
      summary: Eliminar tipo de terapia
      description: Acceso exclusivo de admin.
      responses:
        '204':
          description: Tipo de terapia eliminado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /therapeutic-processes:
    post:
      tags:
      - Therapeutic Processes
      operationId: createTherapeuticProcess
      summary: Crear proceso terapéutico
      description: 'Crea el proceso y sus relaciones con pacientes.

        Debe mantener consistencia entre los registros

        mediante operaciones transaccionales.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTherapeuticProcess'
      responses:
        '201':
          description: Proceso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TherapeuticProcess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /therapeutic-processes/clinics/{clinicId}:
    get:
      tags:
      - Therapeutic Processes
      operationId: getClinicTherapeuticProcesses
      summary: Obtener procesos de una clínica
      description: 'Consulta mediante GSI1.

        Para terapeutas, restringe los resultados

        a los procesos relacionados mediante GSI2.

        '
      parameters:
      - name: clinicId
        in: path
        required: true
        description: ID de la clínica
        schema: *id002
      responses:
        '200':
          description: Procesos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TherapeuticProcess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /therapeutic-processes/patients/{patientId}:
    get:
      tags:
      - Therapeutic Processes
      operationId: getPatientTherapeuticProcesses
      summary: Obtener procesos de un paciente
      description: 'Query de relaciones por PATIENT#{patientId}.

        Recupera procesos mediante BatchGetItem.

        No utiliza Scan.

        '
      parameters:
      - name: patientId
        in: path
        required: true
        description: ID del paciente
        schema: *id003
      responses:
        '200':
          description: Procesos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TherapeuticProcess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
