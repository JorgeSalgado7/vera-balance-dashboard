      - name
      - age
      - relationship_time
      - occupation
      properties:
        name:
          type: string
        age:
          type: integer
          minimum: 0
        relationship_time:
          type: string
        occupation:
          type: string
    CreatePatientRequest:
      type: object
      required:
      - name
