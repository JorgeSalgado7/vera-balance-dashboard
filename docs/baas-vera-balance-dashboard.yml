          - string
          - 'null'
        sex:
          type: string
        education:
          type: string
        occupation:
          type: string
        marital_status:
          type: string
        partner_data:
          oneOf:
          - $ref: '#/components/schemas/PatientPartner'
          - type: 'null'
        religion:
          type: string
