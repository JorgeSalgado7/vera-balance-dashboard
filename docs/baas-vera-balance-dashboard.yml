components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vera_balance_session
      description: 'Cookie HttpOnly que contiene el JWT de sesión. El frontend no accede

        directamente al token; el navegador envía la cookie automáticamente.

        '
    publicOperationToken:
      type: apiKey
      in: header
      name: X-Public-Operation-Token
      description: Token temporal de un solo uso para operaciones sin sesión autenticada. Está limitado a un scope específico, tiene vigencia
        limitada y se consume cuando el endpoint correspondiente acepta la solicitud.
  parameters:
    ClinicId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClinicUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TherapeuticProcessId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientProcessId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TherapeuticProcessRecordId:
      name: therapeuticProcessId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HomeWorkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DateTime:
      type: string
      format: date-time
    UserRole:
      type: string
      enum:
      - clinic
      - therapist
    UserStatus:
      type: string
      enum:
      - active
      - inactive
    ClinicStatus:
      type: string
      enum:
      - active
      - inactive
    TherapeuticProcessStatus:
      type: string
      enum:
      - active
      - inactive
      - discharged
      - unfinished
    TherapyType:
      type: object
      required:
      - name
      - icon
      properties:
        name:
          type: string
        icon:
          type: string
    ClinicReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    UserReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    PatientReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    RecordReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    HomeWorkReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    CreateClinicRequest:
      type: object
      required:
      - name
      - address
      - phone_number
      - therapy_types
      properties:
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
    UpdateClinicRequest:
      type: object
      properties:
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
        status:
          $ref: '#/components/schemas/ClinicStatus'
    ClinicResponse:
      type: object
      required:
      - id
      - name
      - logo
      - address
      - phone_number
      - therapy_types
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
        status:
          $ref: '#/components/schemas/ClinicStatus'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    CreateUserRequest:
      type: object
      required:
      - name
      - email
      - password
      - password_confirmation
      - professional_license
      - clinic_id
      - role
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
        professional_license:
          type: string
        clinic_id:
          type:
          - string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        professional_license:
          type: string
        clinic_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
    UserResponse:
      type: object
      required:
      - id
      - name
      - email
      - professional_license
      - clinic
      - role
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        professional_license:
          type: string
        clinic:
          $ref: '#/components/schemas/ClinicReference'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    SignInRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthSessionResponse:
      type: object
      required:
      - authenticated
      properties:
        authenticated:
          type: boolean
          example: true
    ResetPasswordRequest:
      type: object
      required:
      - password
      - password_confirmation
      properties:
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    CreateCatalogRequest:
      type: object
      required:
      - type
      - name
      - options
      properties:
        type:
          type: string
          description: Identificador lógico único del catálogo utilizado para construir la clave `CATALOG#type`.
          example: MARITAL_STATUS
        name:
          type: string
          example: Estado civil
        options:
          type: array
          items:
            type: string
          example:
          - Soltero
          - En una relación
          - Casado
          - Divorciado
          - Viudo
    UpdateCatalogRequest:
      type: object
      description: Permite actualizar parcialmente un catálogo. El campo `type` no forma parte de la actualización porque es inmutable.
      properties:
        name:
          type: string
        options:
          type: array
          items:
            type: string
    CatalogResponse:
      type: object
      required:
      - id
      - type
      - name
      - options
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del catálogo correspondiente a la clave primaria persistida.
        type:
          type: string
          description: Tipo global del catálogo derivado de la clave `CATALOG#type`.
          example: MARITAL_STATUS
        name:
          type: string
          example: Estado civil
        options:
          type: array
          items:
            type: string
          example:
          - Soltero
          - En una relación
          - Casado
          - Divorciado
          - Viudo
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    PatientGuardian:
      type: object
      required:
      - name
      - phone_number
      - relationship
      properties:
        name:
          type: string
        phone_number:
          type: string
        relationship:
          type: string
    PatientPartner:
