name: User Story
description: Crear una nueva historia de usuario para Vera Balance
title: "HU-[MODULE]-[NUMBER] - "
labels:
  - "user-story"
body:
  - type: markdown
    attributes:
      value: |
        ## Historia de Usuario

        Completa la siguiente información para definir el comportamiento esperado de la funcionalidad.

  - type: textarea
    id: user-story
    attributes:
      label: Historia de usuario
      description: Describe la necesidad desde la perspectiva del usuario.
      placeholder: |
        Como [tipo de usuario],
        quiero [acción],
        para [objetivo o beneficio].
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Agrega el contexto necesario para comprender la funcionalidad.
      placeholder: Describe qué se necesita implementar y por qué.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Criterios de aceptación
      description: Define las condiciones que deben cumplirse para considerar correcta la funcionalidad.
      placeholder: |
        ### CA-01 - [Nombre]

        Dado [contexto o precondición],
        cuando [acción],
        entonces [resultado esperado].

        ### CA-02 - [Nombre]

        Dado [contexto o precondición],
        cuando [acción],
        entonces [resultado esperado].
    validations:
      required: true

  - type: textarea
    id: business-rules
    attributes:
      label: Reglas de negocio
      description: Indica las reglas de negocio específicas que debe respetar esta funcionalidad.
      placeholder: |
        - Regla de negocio 1
        - Regla de negocio 2
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias
      description: Indica otras HU, módulos, servicios o funcionalidades necesarias.
      placeholder: |
        - HU-XXX-000
        - Módulo o servicio requerido

        Si no existen dependencias, indicar "Ninguna".
    validations:
      required: false

  - type: textarea
    id: technical-considerations
    attributes:
      label: Consideraciones técnicas
      description: Agrega únicamente restricciones o decisiones técnicas relevantes para esta funcionalidad.
      placeholder: |
        - Consideración técnica 1
        - Consideración técnica 2
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Referencias
      description: Agrega documentación, diseños, contratos o recursos relacionados.
      placeholder: |
        - docs/database.md
        - docs/openapi.yaml
        - docs/definitions.md
        - Figma
        - Otra HU
    validations:
      required: false

  - type: checkboxes
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Estos puntos deben cumplirse antes de considerar la HU terminada.
      options:
        - label: Todos los criterios de aceptación fueron implementados.
        - label: Se agregaron o actualizaron las pruebas necesarias.
        - label: Las pruebas pasan correctamente.
        - label: El proyecto compila correctamente.
        - label: La documentación técnica fue actualizada cuando corresponde.
        - label: La implementación fue revisada.