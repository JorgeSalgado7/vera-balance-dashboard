components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vera_balance_session
      description: Cookie HttpOnly con JWT de sesión de 5 minutos. El navegador la envía automáticamente; no
        se persiste en base de datos. La renovación se solicita antes de expirar solo mientras el usuario esté
        activo. Sin estado servidor no es posible revocarlo inmediatamente tras logout.
  parameters:
    ClinicId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClinicUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TherapeuticProcessId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientProcessId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TherapeuticProcessRecordId:
      name: therapeuticProcessId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HomeWorkId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DateTime:
      type: string
      format: date-time
    UserRole:
      type: string
      enum:
      - clinic
      - therapist
    UserStatus:
      type: string
      enum:
      - active
      - inactive
    ClinicStatus:
      type: string
      enum:
      - active
      - inactive
    TherapeuticProcessStatus:
      type: string
      enum:
      - active
      - inactive
      - discharged
      - unfinished
    TherapyType:
      type: object
      required:
      - name
      - icon
      properties:
        name:
          type: string
        icon:
          type: string
    ClinicReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    UserReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    PatientReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    RecordReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    HomeWorkReference:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
    CreateClinicRequest:
      type: object
      required:
      - name
      - address
      - phone_number
      - therapy_types
      properties:
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
    UpdateClinicRequest:
      type: object
      properties:
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
        status:
          $ref: '#/components/schemas/ClinicStatus'
    ClinicResponse:
      type: object
      required:
      - id
      - name
      - logo
      - address
      - phone_number
      - therapy_types
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        address:
          type: string
        phone_number:
          type: string
        therapy_types:
          type: array
          items:
            $ref: '#/components/schemas/TherapyType'
        status:
          $ref: '#/components/schemas/ClinicStatus'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    CreateUserRequest:
      type: object
      required:
      - name
      - email
      - password
      - password_confirmation
      - professional_license
      - clinic_id
      - role
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
        password_confirmation:
          type: string
          format: password
          description: Solo validación de coincidencia con password; nunca se persiste.
        professional_license:
          type: string
        clinic_id:
          type:
          - string
          format: uuid
          description: Debe coincidir con el identificador de la clínica del administrador autenticado; no
            autoriza asignaciones entre clínicas.
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        professional_license:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
    UserResponse:
      type: object
      required:
      - id
      - name
      - email
      - professional_license
      - clinic
      - role
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        professional_license:
          type: string
        clinic:
          $ref: '#/components/schemas/ClinicReference'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    SignInRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthSessionResponse:
      type: object
      required:
      - authenticated
      properties:
        authenticated:
          type: boolean
          example: true
    ResetPasswordRequest:
      type: object
      required:
      - password
      - password_confirmation
      properties:
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
    CreateCatalogRequest:
      type: object
      required:
      - type
      - name
      - options
      properties:
        type:
          type: string
          description: Identificador lógico único del catálogo utilizado para construir la clave `CATALOG#type`.
          example: MARITAL_STATUS
        name:
          type: string
          example: Estado civil
        options:
          type: array
          items:
            type: string
          example:
          - Soltero
          - En una relación
          - Casado
          - Divorciado
          - Viudo
    UpdateCatalogRequest:
      type: object
      description: Permite actualizar parcialmente un catálogo. El campo `type` no forma parte de la actualización
        porque es inmutable.
      properties:
        name:
          type: string
        options:
          type: array
          items:
            type: string
    CatalogResponse:
      type: object
      required:
      - id
      - type
      - name
      - options
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del catálogo correspondiente a la clave primaria persistida.
        type:
          type: string
          description: Tipo global del catálogo derivado de la clave `CATALOG#type`.
          example: MARITAL_STATUS
        name:
          type: string
          example: Estado civil
        options:
          type: array
          items:
            type: string
          example:
          - Soltero
          - En una relación
          - Casado
          - Divorciado
          - Viudo
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    PatientGuardian:
      type: object
      required:
      - name
      - phone_number
      - relationship
      properties:
        name:
          type: string
        phone_number:
          type: string
        relationship:
          type: string
    PatientPartner:
      type: object
      required:
      - name
      - age
      - relationship_time
      - occupation
      properties:
        name:
          type: string
        age:
          type: integer
          minimum: 0
        relationship_time:
          type: string
        occupation:
          type: string
    CreatePatientRequest:
      type: object
      required:
      - name
      - age
      - phone_number
      - sex
      - education
      - occupation
      - marital_status
      - religion
      - address
      properties:
        name:
          type: string
        age:
          type: integer
          minimum: 0
        guardian:
          oneOf:
          - $ref: '#/components/schemas/PatientGuardian'
          - type: 'null'
        phone_number:
          type:
          - string
          - 'null'
        sex:
          type: string
        education:
          type: string
        occupation:
          type: string
        marital_status:
          type: string
        partner_data:
          oneOf:
          - $ref: '#/components/schemas/PatientPartner'
          - type: 'null'
        religion:
          type: string
        address:
          type: string
    UpdatePatientRequest:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
          minimum: 0
        guardian:
          oneOf:
          - $ref: '#/components/schemas/PatientGuardian'
          - type: 'null'
        phone_number:
          type:
          - string
          - 'null'
        sex:
          type: string
        education:
          type: string
        occupation:
