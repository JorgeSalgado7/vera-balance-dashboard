  /v1/auth/sign-in:
    post:
      tags:
      - Auth
      summary: Iniciar sesión
      description: 'Valida las credenciales del usuario y crea una sesión autenticada.

        El JWT de sesión se envía exclusivamente mediante una cookie HttpOnly

        y no forma parte del cuerpo de la respuesta.

        '
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: terapeuta@verabalance.com
              password: Password123!
      responses:
        '200':
          description: Sesión iniciada correctamente
          headers:
            Set-Cookie:
              description: Cookie HttpOnly que contiene el JWT de sesión.
              schema:
                type: string
              example: vera_balance_session=<jwt>; Path=/; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Credenciales incorrectas
          content: &id005
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '400': *id002
        '500': *id001
  /v1/auth/sign-out:
    post:
      tags:
      - Auth
      summary: Cerrar sesión
      description: 'Cierra la sesión eliminando la cookie HttpOnly utilizada para

        autenticación. El cliente no necesita enviar el JWT en el body.

        '
      operationId: signOut
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Sesión cerrada correctamente
          headers:
            Set-Cookie:
              description: Elimina la cookie de sesión estableciendo su expiración.
              schema:
                type: string
              example: vera_balance_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0
        '401':
          description: Sesión inválida o no autenticada
          content: *id005
        '403': &id006
          description: Operación no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '500': *id001
  /v1/auth/verify:
    post:
      tags:
      - Auth
      summary: Verificar sesión
      description: 'Verifica el JWT recibido automáticamente mediante la cookie HttpOnly

        de sesión. El JWT no se recibe ni se devuelve en el body.

        '
      operationId: verifySession
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Sesión válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Sesión inválida o expirada
          content: *id005
        '403': *id006
        '500': *id001
